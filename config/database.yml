# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   brew install postgresql
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", ENV["USER"]) %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: billetto_assignment_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: billetto_assignment_test

# Production reads DATABASE_URL, which supplies host, credentials and database
# in one place -- the shape every managed Postgres service hands you.
production:
  <<: *default
  database: billetto_assignment_production
  url: <%= ENV["DATABASE_URL"] %>
